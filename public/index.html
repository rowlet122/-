<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>掃除当番カレンダー</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1f7a6c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="掃除当番">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#edeadf;
  --border:#ddd7c6;
  --text:#262219;
  --text-dim:#766f5e;
  --accent:#1f7a6c;
  --accent-contrast:#ffffff;
  --accent-soft:#e1efe9;
  --good:#2f9e59;
  --good-soft:#e3f5e9;
  --warn:#c17f1a;
  --warn-soft:#faeed8;
  --bad:#c24a4a;
  --bad-soft:#fae3e1;
  --chip:#efece2;
  --shadow:0 8px 24px rgba(40,35,20,0.10);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a;
    --surface:#1e2224;
    --surface-2:#262b2c;
    --border:#343b3a;
    --text:#e9e6dd;
    --text-dim:#9a9f93;
    --accent:#52d2b8;
    --accent-contrast:#0a1716;
    --accent-soft:#1c3330;
    --good:#4fbd84;
    --good-soft:#1c342a;
    --warn:#e2ac4c;
    --warn-soft:#3a2f1a;
    --bad:#e4817a;
    --bad-soft:#3b2220;
    --chip:#2a2f2f;
    --shadow:0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#15181a;
  --surface:#1e2224;
  --surface-2:#262b2c;
  --border:#343b3a;
  --text:#e9e6dd;
  --text-dim:#9a9f93;
  --accent:#52d2b8;
  --accent-contrast:#0a1716;
  --accent-soft:#1c3330;
  --good:#4fbd84;
  --good-soft:#1c342a;
  --warn:#e2ac4c;
  --warn-soft:#3a2f1a;
  --bad:#e4817a;
  --bad-soft:#3b2220;
  --chip:#2a2f2f;
  --shadow:0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
  touch-action:manipulation;
  display:flex;
  flex-direction:column;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{text-wrap:balance;margin:0;}
button{font-family:inherit;}
.app{
  max-width:560px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px;
  flex:1; min-height:0;
  padding-inline:8px;
  padding-block:env(safe-area-inset-top,0px) calc(90px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;
  overscroll-behavior:contain;
}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:6px 4px; margin-inline:-8px; padding-inline:8px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--accent-contrast);
  font-weight:900;font-size:15px;flex:none;
}
.brand .title{font-weight:700;font-size:15px;letter-spacing:.01em;}
.userchip{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 6px;
  font-size:12.5px; color:var(--text); cursor:pointer; flex:none;
}
.userchip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
.userchip.offline .dot{background:var(--text-dim);}
.iconbtn{
  width:32px;height:32px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-dim); cursor:pointer; flex:none;
  display:flex;align-items:center;justify-content:center;
}
.iconbtn svg{width:17px;height:17px;display:block;}
.tabbtn .ic svg{width:19px;height:19px;display:block;}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.field label{font-size:12px; font-weight:600; color:var(--text-dim);}
.field input{
  border:1px solid var(--border); border-radius:9px; padding:9px 10px; font-size:14px;
  background:var(--surface); color:var(--text); font-family:inherit;
}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.monthnav h2{font-size:17px;font-weight:700;}
.navbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:16px; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.navbtn:disabled{opacity:.35;cursor:default;}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;color:var(--text-dim);text-align:center;padding-inline:0;}
.dow-row .we{color:var(--text-dim); opacity:.6;}
.cal-viewport{overflow:hidden; width:100%;}
.cal-track{display:flex; width:300%; transform:translateX(-33.3334%);}
.weeks{display:flex;flex-direction:column;gap:2px; flex:0 0 33.3334%; min-width:0;}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.cell.weekend{background:var(--surface-2); opacity:.55; cursor:default; min-height:40px;}
.cell.weekend .d{color:var(--text-dim);}
.cell{
  position:relative; min-height:68px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface); padding:4px 2px 3px 4px; cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:2px; min-width:0;
}
.cell.other-month{opacity:.42;}
.cell .d{font-size:11px; font-weight:700;}
.cell .status-bar{position:absolute; left:0; top:0; bottom:0; width:3px;}
.cell .names{display:flex;flex-direction:column;gap:1px; margin-top:auto;}
.cell .nm{font-size:9px; line-height:1.2; font-weight:500; color:var(--text); white-space:normal; word-break:break-word; overflow-wrap:anywhere;}
.cell .nm.absent{text-decoration:line-through; opacity:.6;}
.cell .today-ring{position:absolute; inset:2px; border:2px solid var(--accent); border-radius:7px; pointer-events:none;}
.cell.holiday .d{color:var(--bad);}
.cell .tag{font-size:7.5px; color:var(--text-dim); line-height:1.15;}
.full{background:var(--good-soft);}
.half{background:var(--warn-soft);}
.none{background:var(--bad-soft);}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:center; gap:6px;
}
.tabbar-inner{display:flex; gap:6px; width:100%; max-width:560px;}
.tabbtn{
  flex:1; border:none; background:transparent; color:var(--text-dim);
  padding:8px 4px; border-radius:12px; font-size:12px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
}
.tabbtn.active{color:var(--accent); background:var(--accent-soft);}
.tabbtn .ic{font-size:17px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
.section-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}

.stat-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-rank{width:20px; text-align:center; font-size:11px; color:var(--text-dim); flex:none;}
.stat-name{flex:1; font-size:13.5px; font-weight:600;}
.stat-bar-track{flex:1.4; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.stat-bar{height:100%; background:var(--accent); border-radius:4px;}
.stat-nums{display:flex; gap:10px; font-size:12px; flex:none;}
.stat-nums b{font-size:14px;}
.stat-nums .lbl{color:var(--text-dim); font-size:10px; display:block;}

.overlay{
  position:fixed; inset:0; background:rgba(20,18,12,0.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.overlay[hidden]{display:none;}
.sheet{
  width:100%; max-width:560px; background:var(--surface); border-radius:20px 20px 0 0;
  max-height:88vh; overflow-y:auto; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);
}
.sheet-handle{
  width:100%; height:28px; margin:-6px 0 2px; touch-action:none;
  display:flex; align-items:center; justify-content:center; cursor:grab;
}
.sheet-handle::before{content:""; width:36px; height:4px; background:var(--border); border-radius:3px;}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.sheet-head h3{font-size:17px; font-weight:700;}
.sheet-head .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
.closebtn{border:none; background:var(--surface-2); width:30px;height:30px;border-radius:9px; color:var(--text); font-size:15px; cursor:pointer; flex:none;}

.slot{border:1px solid var(--border); border-radius:13px; padding:11px; margin-bottom:9px; display:flex; flex-direction:column; gap:8px;}
.slot-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.slot-who{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; flex:none;}
.badge{font-size:10.5px; padding:2px 7px; border-radius:999px; font-weight:700;}
.badge.absent{background:var(--bad-soft); color:var(--bad);}
.badge.open{background:var(--surface-2); color:var(--text-dim);}
.btnrow{display:flex; gap:6px; flex-wrap:wrap;}
.btn{border:none; border-radius:9px; padding:7px 11px; font-size:12.5px; font-weight:600; cursor:pointer;}
.btn.primary{background:var(--accent); color:var(--accent-contrast);}
.btn.ghost{background:var(--surface-2); color:var(--text);}
.btn.danger{background:var(--bad-soft); color:var(--bad);}
.btn:disabled{opacity:.4; cursor:default;}
.reqline{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border-radius:9px; padding:6px 9px; font-size:12px;}

.task{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
.task:last-child{border-bottom:none;}
.task input{width:19px;height:19px; margin-top:2px; accent-color:var(--accent); flex:none;}
.task .tx{font-size:13.5px; font-weight:600; line-height:1.4;}
.task .tx.done{text-decoration:line-through; color:var(--text-dim);}
.task .detail{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-top:3px;}
.task .meta{font-size:10px; color:var(--accent); margin-top:3px;}
.group-label{font-size:11.5px; font-weight:700; color:var(--accent); margin:16px 0 2px; text-transform:uppercase; letter-spacing:.03em;}
.group-label:first-child{margin-top:0;}

.roster{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px;}
.rosterbtn{
  border:1px solid var(--border); background:var(--surface-2); border-radius:12px;
  padding:12px 8px; text-align:center; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--text);
}
.rosterbtn.taken{opacity:.65;}
.rosterbtn .tk{display:block; font-size:10px; font-weight:500; color:var(--text-dim); margin-top:3px;}

.banner{background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.5;}
.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:60;
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:12.5px;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><div class="mark">掃</div><div class="title">掃除当番カレンダー</div></div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="iconbtn" id="installBtn" title="ホーム画面に追加" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg></button>
      <button class="iconbtn" id="notifyBtn" title="通知を許可"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6 2 7H4c.5-1 2-2.5 2-7Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg></button>
      <button class="iconbtn" id="adminBtn" title="管理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg></button>
      <button class="userchip offline" id="userChip"><span class="dot"></span><span id="userChipLabel">未ログイン</span></button>
    </div>
  </div>

  <div id="bannerArea"></div>

  <div id="calendarView">
    <div class="monthnav">
      <button class="navbtn" id="prevMonth">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="navbtn" id="nextMonth">›</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>2人そろい</span>
      <span><i style="background:var(--warn)"></i>1人</span>
      <span><i style="background:var(--bad)"></i>まだ誰もいない</span>
    </div>
    <div class="dow-row"><div class="we">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="we">土</div></div>
    <div class="cal-viewport" id="calViewport">
      <div class="cal-track" id="calTrack">
        <div class="weeks" id="weeksPrev"></div>
        <div class="weeks" id="weeksCur"></div>
        <div class="weeks" id="weeksNext"></div>
      </div>
    </div>
  </div>

  <div id="statsView" hidden>
    <div class="card">
      <div class="monthnav" style="margin-bottom:10px;">
        <button class="navbtn" id="statsPrev">‹</button>
        <h2 id="statsMonthLabel" style="font-size:15px;"></h2>
        <button class="navbtn" id="statsNext">›</button>
      </div>
      <div class="section-title">当月の担当回数</div>
      <div id="statsMonth"></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-title" id="statsTotalLabel">通算の担当回数</div>
      <div id="statsTotal"></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tabbtn active" data-tab="calendar"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span>カレンダー</button>
    <button class="tabbtn" data-tab="stats"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="5" y2="11"/><line x1="12" y1="19" x2="12" y2="5"/><line x1="19" y1="19" x2="19" y2="14"/></svg></span>統計</button>
  </div>
</div>

<div class="overlay" id="dayOverlay" hidden>
  <div class="sheet" id="daySheet"></div>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <div class="sheet" id="loginSheet"></div>
</div>

<div class="overlay" id="adminOverlay" hidden>
  <div class="sheet" id="adminSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var MEMBERS = [
  {id:"takai", name:"高井"},
  {id:"yamamoto", name:"山本"},
  {id:"takahashi", name:"高橋"},
  {id:"kakihara", name:"柿原"},
  {id:"sao", name:"竿"},
  {id:"seyama", name:"瀬山"},
  {id:"yuki", name:"優希"},
  {id:"masaya", name:"まさや"},
  {id:"koike", name:"小池"},
  {id:"tsunoda", name:"角田"}
];
function memberName(id){ var m=MEMBERS.find(function(x){return x.id===id;}); return m?m.name:id; }

// Populated from /api/config at startup (see applyConfig) so the active term
// can be moved forward (e.g. to next year's term) without a code change.
var MONTHS = [];
var RANGE_START = null;
var RANGE_END = null;
var HOLIDAYS = {};
var PERIOD = {start:"", end:"", label:""};

// group: "daily" = every day regardless of conditions, always check-all'able.
//        "weekday" = scheduled by the calendar (a specific day of week, Nth
//        week, or the day before a holiday) — deterministic, so also safe
//        to bulk-check.
//        "conditional" = only applies if some real-world condition happens
//        to be true that day (something arrived, it's summer, it's running
//        low) — excluded from "すべてチェック" since it may well not apply.
var DAILY_TASKS = [
  {id:"enter", group:"daily", text:"入室する", detail:"学生証をタッチ→暗証番号「5460」を入力→解錠ボタンを押す"},
  {id:"pc", group:"daily", text:"パソコンの電源をONにする"},
  {id:"dishes", group:"daily", text:"食器を洗う"},
  {id:"triangle", group:"daily", text:"三角コーナーの袋を入れ替える"},
  {id:"mugicha", group:"daily", text:"麦茶を作る"},
  {id:"pot", group:"daily", text:"ポットの水を交換する", detail:"水を入れ替えてコンセントを挿す"},
  {id:"ice", group:"conditional", text:"（夏季のみ）冷凍庫の氷を作る"},
  {id:"evaporator", group:"daily", text:"エバポレーターをセットする", detail:"コンセントを挿す→①をON（Poff表示ならSet Clear）→②を押しCの点滅を確認→温度がマイナスになったら③を押しPump点灯を確認"},
  {id:"gomi_matome", group:"daily", text:"一般ゴミ・実験ゴミをまとめる", detail:"実験ゴミには廃液ラベル(赤・入口左の引き出し2段目)を貼り、日付・研究室名・自分の名前・含有主物質名(メタノール/アセトン)を記入する"},
  {id:"gomi_dashi", group:"daily", text:"ゴミを捨てに行く", detail:"一般ゴミ、入口のペットボトル・缶・ビン、ドラフト内の空の一斗缶・空ビン、金属、ガラス、ダンボール"},
  {id:"haieki_tank", group:"daily", text:"廃液タンクの残量を確認する", detail:"限界ラインを超えそうならロートを外して蓋を閉め、廃液ラベルをタンクの口が斜めの側に貼る。新しいポリタンクにロートを付け替え、持ち手に細長いシールを貼る（含水=青:水/アセトン、有機=赤:メタノール/アセトン、難燃=黄:クロロホルム）"},
  {id:"solvent", group:"conditional", text:"溶媒を補充する（デュワー瓶が空になったら）", detail:"一斗缶から灯油ポンプで移し替える。一斗缶も残り少なければ試薬ファイル(緑)から発注する"},
  {id:"trap", group:"daily", text:"トラップ管を片付ける", detail:"中身は含水へ廃棄→メタノール/アセトンで洗浄→引き出しへ収納"},
  {id:"dryrack", group:"daily", text:"網棚1段目の乾燥済み器具を所定の場所へ片付ける"},
  {id:"iaso_register", group:"conditional", text:"薬品が届いていたらIASOに登録する"},
  {id:"iaso_check", group:"conditional", text:"IASOの指定数量が0.2を超えていないか確認する（たまにでOK）", detail:"超えていたら使用済み試薬を削除する"},
  {id:"vacuum", group:"daily", text:"掃除機をかける"},
  {id:"seikyo", group:"conditional", text:"ホワイトボードに購入希望が書いてあったら生協で買い出しする", detail:"佐々木先生の個室入って右の引き出し1段目から生協カードを取り、レジで提示。買い出し後はレシートとカードを引き出しへ戻す"}
];
var LIQUID_N2_TASK = {id:"liquid_n2", group:"daily", text:"液体窒素の残量を確認する", detail:"不足時は申込用紙(入口左の引き出し1段目)に内線5766・ハンコ・日付・希望量「満タン」・残量を記入し折ってクリアファイルへ。台車で10号館横の供給所へ。回収後は1階でエレベーターに液体窒素のみ乗せ、人は同乗せず3階まで階段で向かう"};

function pad(n){ return n<10?"0"+n:""+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseIso(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayIso(){ return iso(new Date()); }
function sameDay(a,b){ return iso(a)===iso(b); }

var HOLIDAY_EVE = {};

function applyConfig(period, holidays){
  PERIOD = period || PERIOD;
  HOLIDAYS = holidays || {};
  RANGE_START = parseIso(PERIOD.start);
  RANGE_END = parseIso(PERIOD.end);

  MONTHS = [];
  var cur = new Date(RANGE_START.getFullYear(), RANGE_START.getMonth(), 1);
  var endMarker = new Date(RANGE_END.getFullYear(), RANGE_END.getMonth(), 1);
  while(cur<=endMarker){
    MONTHS.push({y:cur.getFullYear(), m:cur.getMonth()});
    cur.setMonth(cur.getMonth()+1);
  }
  if(MONTHS.length===0){
    var now0=new Date();
    MONTHS.push({y:now0.getFullYear(), m:now0.getMonth()});
  }

  HOLIDAY_EVE = {};
  Object.keys(HOLIDAYS).sort().forEach(function(hIso){
    var hd = parseIso(hIso);
    var c = new Date(hd);
    for(var i=0;i<10;i++){
      c.setDate(c.getDate()-1);
      if(c<RANGE_START) return;
      var dow = c.getDay();
      if(dow>=1 && dow<=5 && !HOLIDAYS[iso(c)]){
        HOLIDAY_EVE[iso(c)] = {label:HOLIDAYS[hIso], holidayIso:hIso};
        return;
      }
    }
  });

  var now = new Date();
  state.monthIdx = 0; state.statsMonthIdx = 0;
  for(var i=0;i<MONTHS.length;i++){
    if(now.getFullYear()===MONTHS[i].y && now.getMonth()===MONTHS[i].m){ state.monthIdx=i; state.statsMonthIdx=i; break; }
  }
  if(now < RANGE_START){ state.monthIdx=0; state.statsMonthIdx=0; }
  else if(now > RANGE_END){ state.monthIdx=MONTHS.length-1; state.statsMonthIdx=MONTHS.length-1; }
}

function weekOfMonth(d){ return Math.ceil(d.getDate()/7); }

function buildTasks(dateStr){
  var d = parseIso(dateStr);
  var dow = d.getDay();
  var list = DAILY_TASKS.slice();
  if(dow!==4) list.push(LIQUID_N2_TASK); // every day except Thursday
  if(dow===1 && d.getDate()<=7){
    list.push({id:"bousai", group:"weekday", text:"防災安全チェック（第1月曜）", detail:"入口近くの赤いファイルに日付とチェックを記入する"});
  }
  if(dow===2){
    list.push({id:"haieki_yoyaku_tue", group:"weekday", text:"廃液予約をする"});
    var w = weekOfMonth(d);
    if(w===2||w===4){
      list.push({id:"sodai", group:"weekday", text:"粗大ゴミを出す（第2・4火曜）", detail:"不要な椅子などがあれば5号館と11号館の間のスペースへ運ぶ"});
    }
  }
  if(dow===3){ list.push({id:"haieki_kaishu_wed", group:"weekday", text:"廃液回収日"}); }
  if(dow===4){ list.push({id:"haieki_yoyaku_thu", group:"weekday", text:"廃液予約をする"}); }
  if(dow===5){
    list.push({id:"haieki_kaishu_fri", group:"weekday", text:"廃液回収日"});
    list.push({id:"kyujitsu_weekly", group:"weekday", text:"休日届けを提出する", detail:"施設使用申込書(入口左奥の引き出し1段目)の「2.休日登校」に○、日時に次の日曜 8:00〜21:00 と記入し、5号館入口の警備員さんへ提出する"});
  }
  var eve = HOLIDAY_EVE[dateStr];
  if(eve){
    list.push({id:"holiday_todoke_"+eve.holidayIso, group:"weekday", text:(eve.holidayIso+"「"+eve.label+"」の休日届けを早めに提出する（まだなら）")});
  }
  return list;
}

function allDaysOfMonth(y,m){
  var out=[];
  var d = new Date(y,m,1);
  while(d.getMonth()===m){
    out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

// ---------- API ----------
async function api(path, opts){
  opts = opts || {};
  var headers = {"content-type":"application/json"};
  if(state.token) headers["authorization"] = "Bearer "+state.token;
  var res;
  try{
    res = await fetch(path, {
      method: opts.method||"GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }catch(e){
    state.online = false; renderBanner();
    return {ok:false, status:0, data:{error:"network"}};
  }
  state.online = true; renderBanner();
  var data = {};
  try{ data = await res.json(); }catch(e){}
  return {ok: res.ok, status: res.status, data: data};
}

function monthLabel(mo){ return mo.y+"年"+(mo.m+1)+"月"; }

function renderMonthInto(container, mo){
  container.innerHTML = "";
  if(!mo) return; // out of range (before first / after last month) — leave blank

  var days = allDaysOfMonth(mo.y, mo.m);

  // Fill the lead/trail of the grid with the adjoining month's real dates
  // (dimmed) instead of leaving them blank, so a week split across two
  // months stays fully visible.
  var leadCount = days[0].getDay(); // 0(Sun)..6(Sat), week starts Sunday
  var week = [];
  for(var i=leadCount;i>0;i--){
    var ld = new Date(days[0]);
    ld.setDate(ld.getDate()-i);
    week.push(ld);
  }
  days.forEach(function(d){
    week.push(d);
    if(week.length===7){ container.appendChild(renderWeekRow(week, mo.m)); week=[]; }
  });
  if(week.length){
    var last = days[days.length-1];
    var n = 1;
    while(week.length<7){
      var td = new Date(last);
      td.setDate(td.getDate()+n);
      week.push(td);
      n++;
    }
    container.appendChild(renderWeekRow(week, mo.m));
  }
}

function renderCalendar(){
  if(!MONTHS.length) return;
  var mo = MONTHS[state.monthIdx];
  $("#monthLabel").textContent = monthLabel(mo);
  $("#prevMonth").disabled = state.monthIdx===0;
  $("#nextMonth").disabled = state.monthIdx===MONTHS.length-1;

  renderMonthInto($("#weeksPrev"), MONTHS[state.monthIdx-1] || null);
  renderMonthInto($("#weeksCur"), mo);
  renderMonthInto($("#weeksNext"), MONTHS[state.monthIdx+1] || null);

  var track = $("#calTrack");
  track.style.transition = "none";
  track.style.transform = "translateX(-33.3334%)";
  // force reflow so the next transform change (if any) animates again
  void track.offsetHeight;
}

function renderWeekRow(week, currentMonth){
  var row=document.createElement("div");
  row.className="week";
  week.forEach(function(d){
    row.appendChild(renderCell(d, d.getMonth()!==currentMonth));
  });
  return row;
}

function slotCount(data){
  if(!data) return 0;
  var c=0;
  if(data.slot1 && data.slot1.memberId && data.slot1.status!=="absent") c++;
  if(data.slot2 && data.slot2.memberId && data.slot2.status!=="absent") c++;
  return c;
}

function renderCell(d, otherMonth){
  var ds = iso(d);
  var dow = d.getDay();
  var otherCls = otherMonth ? " other-month" : "";
  if(dow===0 || dow===6){
    var wcell=document.createElement("div");
    wcell.className="cell weekend"+otherCls;
    wcell.innerHTML = '<div class="d">'+d.getDate()+'</div>';
    return wcell;
  }
  var data = state.days.get(ds);
  var cnt = slotCount(data);
  var cell=document.createElement("button");
  cell.className="cell "+(cnt===2?"full":cnt===1?"half":"none")+(HOLIDAYS[ds]?" holiday":"")+otherCls;
  cell.setAttribute("type","button");
  var bar = cnt===2?"var(--good)":cnt===1?"var(--warn)":"var(--bad)";
  var html = '<div class="status-bar" style="background:'+bar+'"></div>';
  if(sameDay(d,new Date())) html += '<div class="today-ring"></div>';
  html += '<div class="d">'+d.getDate()+'</div>';
  if(HOLIDAYS[ds]) html += '<div class="tag">'+HOLIDAYS[ds]+'</div>';
  var names = [];
  [data&&data.slot1, data&&data.slot2].forEach(function(s){
    if(s && s.memberId) names.push('<div class="nm'+(s.status==="absent"?" absent":"")+'">'+escapeHtml(s.name||memberName(s.memberId))+'</div>');
  });
  html += '<div class="names">'+names.join("")+'</div>';
  cell.innerHTML = html;
  cell.addEventListener("click", function(){ openDay(ds); });
  return cell;
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function renderStats(){
  if(!MONTHS.length) return;
  renderStatsTable($("#statsMonth"), true);
  renderStatsTable($("#statsTotal"), false);
  $("#statsMonthLabel").textContent = monthLabel(MONTHS[state.statsMonthIdx]);
  $("#statsPrev").disabled = state.statsMonthIdx===0;
  $("#statsNext").disabled = state.statsMonthIdx===MONTHS.length-1;
  var startLabel = RANGE_START ? (RANGE_START.getFullYear()+"/"+(RANGE_START.getMonth()+1)) : "";
  $("#statsTotalLabel").textContent = "通算の担当回数（"+startLabel+"〜）";
}

function renderStatsTable(container, monthOnly){
  var mo = MONTHS[state.statsMonthIdx];
  var counts = {};
  MEMBERS.forEach(function(m){ counts[m.id]=0; });
  var today = todayIso();
  var periodStart = PERIOD.start || "0000-00-00";
  state.days.forEach(function(data, ds){
    if(ds>today || ds<periodStart) return;
    if(monthOnly){
      var d=parseIso(ds);
      if(d.getFullYear()!==mo.y || d.getMonth()!==mo.m) return;
    }
    [data.slot1, data.slot2].forEach(function(s){
      if(s && s.memberId && s.status!=="absent" && counts.hasOwnProperty(s.memberId)) counts[s.memberId]++;
    });
  });
  var rows = MEMBERS.map(function(m){ return {id:m.id, name:m.name, n:counts[m.id]}; });
  rows.sort(function(a,b){ return b.n-a.n || a.name.localeCompare(b.name,"ja"); });
  var max = Math.max(1, rows[0]?rows[0].n:1);
  container.innerHTML = rows.map(function(r,i){
    return '<div class="stat-row">'+
      '<div class="stat-rank">'+(i+1)+'</div>'+
      '<div class="stat-name">'+escapeHtml(r.name)+(r.id===state.memberId?' <span class="mono" style="color:var(--accent);font-size:10px;">(あなた)</span>':'')+'</div>'+
      '<div class="stat-bar-track"><div class="stat-bar" style="width:'+Math.round(r.n/max*100)+'%"></div></div>'+
      '<div class="stat-nums mono"><b>'+r.n+'</b></div>'+
    '</div>';
  }).join("");
}

function renderDayModal(){
  if(!state.openDate) return;
  var ds = state.openDate;
  var d = parseIso(ds);
  var data = state.days.get(ds) || {};
  var dowLabel = ["日","月","火","水","木","金","土"][d.getDay()];
  var sheet = $("#daySheet");

  var head = '<div class="sheet-handle"></div><div class="sheet-head">'+
    '<div><h3>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+dowLabel+'）</h3>'+
    '<div class="sub">'+(HOLIDAYS[ds]?('祝日：'+HOLIDAYS[ds]+'　'):'')+(ds===todayIso()?'本日':'')+'</div></div>'+
    '<button class="closebtn" id="dayClose">✕</button></div>';

  var slotsHtml = ["slot1","slot2"].map(function(key){ return renderSlot(ds, data, key); }).join("");

  var tasks = buildTasks(ds);
  var checklist = data.checklist || {};
  function renderTask(t){
    var done = checklist[t.id] && checklist[t.id].done;
    return '<label class="task">'+
      '<input type="checkbox" data-task="'+t.id+'" '+(done?"checked":"")+'>'+
      '<div><div class="tx '+(done?"done":"")+'">'+escapeHtml(t.text)+'</div>'+
      (t.detail?('<div class="detail">'+escapeHtml(t.detail)+'</div>'):'')+
      (done?('<div class="meta">✓ '+escapeHtml(checklist[t.id].by||'')+'</div>'):'')+
      '</div></label>';
  }
  var GROUP_LABELS = {daily:"毎日のタスク", weekday:"今日の曜日のタスク", conditional:"条件付きタスク（該当する場合のみ）"};
  var tasksHtml = ["daily","weekday","conditional"].map(function(g){
    var items = tasks.filter(function(t){ return t.group===g; });
    if(!items.length) return "";
    return '<div class="group-label">'+GROUP_LABELS[g]+'</div>'+items.map(renderTask).join("");
  }).join("");

  sheet.innerHTML = head +
    '<div class="section-title" style="margin-top:4px;">担当（2名）</div>'+
    slotsHtml+
    '<div class="section-title" style="margin-top:14px; display:flex; align-items:center; justify-content:space-between;">'+
      '<span>やることリスト</span>'+
      '<span class="btnrow" style="gap:6px;">'+
        '<button class="btn ghost" id="checkAllBtn" type="button">すべてチェック</button>'+
        '<button class="btn ghost" id="uncheckAllBtn" type="button">すべて解除</button>'+
      '</span>'+
    '</div>'+
    '<div id="taskList">'+tasksHtml+'</div>';

  $("#dayClose").addEventListener("click", closeDay);
  sheet.querySelectorAll("[data-join]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"join",{slot:b.dataset.join}); }); });
  sheet.querySelectorAll("[data-leave]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"leave",{slot:b.dataset.leave}); }); });
  sheet.querySelectorAll("[data-absent]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"absent",{slot:b.dataset.absent}); }); });
  sheet.querySelectorAll("[data-request]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"request",{slot:b.dataset.request}); toast("交代リクエストを送りました"); }); });
  sheet.querySelectorAll("[data-approve]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"approve",{slot:b.dataset.approve, targetMemberId:b.dataset.mid}); }); });
  sheet.querySelectorAll("[data-decline]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"decline",{slot:b.dataset.decline, targetMemberId:b.dataset.mid}); }); });
  sheet.querySelectorAll("[data-task]").forEach(function(b){ b.addEventListener("change", function(){
    if(!state.memberId){ toast("先に名前を登録してください"); renderDayModal(); return; }
    dayOp(ds,"task",{taskId:b.dataset.task, done:b.checked});
  }); });
  $("#checkAllBtn").addEventListener("click", function(){
    if(!state.memberId){ toast("先に名前を登録してください"); return; }
    var ids = tasks.filter(function(t){ return t.group!=="conditional"; }).map(function(t){return t.id;});
    dayOp(ds,"taskAll",{taskIds: ids, done:true});
  });
  $("#uncheckAllBtn").addEventListener("click", function(){
    dayOp(ds,"taskAll",{taskIds: tasks.map(function(t){return t.id;}), done:false});
  });
}

function renderSlot(ds, data, key){
  var s = data[key];
  var myId = state.memberId;
  if(!s || !s.memberId){
    return '<div class="slot"><div class="slot-top">'+
      '<div class="slot-who"><div class="avatar">?</div>枠が空いています</div>'+
      '<span class="badge open">未定</span></div>'+
      '<div class="btnrow"><button class="btn primary" data-join="'+key+'" '+(!myId?"disabled":"")+'>この枠に参加する</button></div></div>';
  }
  var nm = s.name || memberName(s.memberId);
  var initial = nm.slice(0,1);
  var isMe = s.memberId===myId;
  var absent = s.status==="absent";
  var reqs = data[key==="slot1"?"req1":"req2"] || [];
  var iAlreadyRequested = reqs.some(function(r){ return r.memberId===myId; });

  var top = '<div class="slot-top"><div class="slot-who"><div class="avatar">'+escapeHtml(initial)+'</div>'+escapeHtml(nm)+'</div>'+
    (absent? '<span class="badge absent">欠席</span>' : '')+
    '</div>';

  var btns = '<div class="btnrow">';
  if(absent){
    btns += '<button class="btn ghost" data-absent="'+key+'" '+(!myId?"disabled":"")+'>出席に戻す</button>';
    if(!isMe) btns += '<button class="btn primary" data-join="'+key+'" '+(!myId?"disabled":"")+'>代わりに参加する</button>';
  } else if(isMe){
    btns += '<button class="btn danger" data-leave="'+key+'">参加を取り消す</button>';
  } else {
    btns += '<button class="btn ghost" data-absent="'+key+'" '+(!myId?"disabled":"")+'>欠席にする</button>';
    btns += '<button class="btn ghost" data-request="'+key+'" '+(!myId||iAlreadyRequested?"disabled":"")+'>'+(iAlreadyRequested?"交代リクエスト送信済み":"交代をリクエスト")+'</button>';
  }
  btns += '</div>';

  var reqHtml = "";
  if(isMe && !absent && reqs.length){
    reqHtml = '<div style="display:flex;flex-direction:column;gap:6px;">'+reqs.map(function(r){
      return '<div class="reqline"><span>'+escapeHtml(r.name)+' さんから交代リクエスト</span>'+
        '<span class="btnrow"><button class="btn primary" data-approve="'+key+'" data-mid="'+r.memberId+'">承認</button>'+
        '<button class="btn ghost" data-decline="'+key+'" data-mid="'+r.memberId+'">却下</button></span></div>';
    }).join("")+'</div>';
  }

  return '<div class="slot">'+top+btns+reqHtml+'</div>';
}

// ---------- data sync ----------
async function refreshState(){
  var r = await api("/api/state");
  if(!r.ok) return;
  var map = new Map();
  Object.keys(r.data.days||{}).forEach(function(ds){ map.set(ds, r.data.days[ds]); });
  state.days = map;
  var claimed = {};
  (r.data.claimed||[]).forEach(function(id){ claimed[id]=true; });
  state.claimed = claimed;
  renderCalendar(); renderStats();
  if(!state.memberId) renderLogin();
  if(state.openDate) renderDayModal();
}

async function init(){
  var cfgRes = await api("/api/config");
  applyConfig(
    cfgRes.ok ? cfgRes.data.period : {start:"2026-10-01", end:"2027-03-31", label:""},
    cfgRes.ok ? cfgRes.data.holidays : {}
  );
  renderCalendar();
  renderStats();

  if(state.token){
    var r = await api("/api/me");
    if(r.ok && r.data.memberId){ state.memberId = r.data.memberId; }
  }
  renderUserChip();
  await refreshState();
  renderLogin();
  setInterval(refreshState, 15000);
}

async function pickMember(memberId, force){
  var r = await api("/api/claim", {method:"POST", body:{memberId: memberId, force: !!force}});
  if(!r.ok){
    if(r.data && r.data.error==="already_claimed") toast("その名前はすでに使われています");
    else toast("登録に失敗しました。もう一度お試しください");
    await refreshState();
    return;
  }
  state.token = r.data.token;
  localStorage.setItem(TOKEN_KEY, state.token);
  state.memberId = r.data.memberId;
  renderUserChip(); renderLogin();
  await refreshState();
  toast(memberName(memberId)+" として登録しました");
}

async function changeIdentity(){
  if(!state.memberId) return;
  if(!confirm("名前の登録を解除して選び直しますか？")) return;
  await api("/api/release", {method:"POST", body:{}});
  state.memberId = null;
  renderUserChip();
  await refreshState();
}

async function saveAdminPeriod(){
  var pw = $("#adminPw").value.trim();
  var start = $("#periodStart").value;
  var end = $("#periodEnd").value;
  var label = $("#periodLabel").value.trim();
  if(!pw){ toast("パスワードを入力してください"); return; }
  if(!start || !end){ toast("開始日と終了日を入力してください"); return; }
  sessionStorage.setItem(ADMIN_KEY, pw);
  var res;
  try{
    res = await fetch("/api/admin/period", {
      method:"POST",
      headers:{"content-type":"application/json","x-admin-password":pw},
      body: JSON.stringify({start:start, end:end, label:label})
    });
  }catch(e){ toast("通信に失敗しました"); return; }
  if(res.status===403){ toast("パスワードが違います"); return; }
  if(!res.ok){ toast("更新に失敗しました"); return; }
  var data = await res.json();
  applyConfig(data.period, HOLIDAYS);
  renderCalendar(); renderStats();
  closeAdmin();
  toast("期間を切り替えました: "+(data.period.label||""));
}

// ---------- PWA install ----------
var deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  $("#installBtn").hidden = false;
});
window.addEventListener("appinstalled", function(){ $("#installBtn").hidden = true; });

function isIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone; }

async function handleInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    $("#installBtn").hidden = true;
    return;
  }
  if(isIos()){
    toast("共有ボタン→「ホーム画面に追加」で追加できます");
  } else {
    toast("ブラウザのメニューから「ホーム画面に追加」を選んでください");
  }
}

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("/sw.js").then(function(reg){
      reg.update(); // check for a newer sw.js immediately, don't wait for the browser's own schedule
      reg.addEventListener("updatefound", function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener("statechange", function(){
          // a controller change means the new worker just took over — this
          // tab was being served by the old one, so reload once to pick up
          // the fresh shell instead of staying on stale cached content.
          if(nw.state==="activated" && navigator.serviceWorker.controller){
            window.location.reload();
          }
        });
      });
    }).catch(function(){});
  });
}
if(isIos() && !isStandalone()){
  document.addEventListener("DOMContentLoaded", function(){ $("#installBtn").hidden = false; });
}

// ---------- Web Push ("通知を許可") ----------
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - base64String.length % 4) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var raw = atob(base64);
  var arr = new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function enablePush(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window)){
    toast("この端末・ブラウザは通知に対応していません");
    return;
  }
  if(isIos() && !isStandalone()){
    toast("iPhoneでは、まずホーム画面に追加してから、そのアイコンで開いた状態で通知を許可してください");
    return;
  }
  var perm = await Notification.requestPermission();
  if(perm !== "granted"){ toast("通知が許可されませんでした"); return; }
  try{
    var reg = await navigator.serviceWorker.ready;
    var keyRes = await api("/api/push/public-key");
    if(!keyRes.ok || !keyRes.data.publicKey){ toast("サーバー側の通知設定が未完了です"); return; }
    var existing = await reg.pushManager.getSubscription();
    var sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(keyRes.data.publicKey)
    });
    await api("/api/push/subscribe", {method:"POST", body:{subscription: sub.toJSON()}});
    toast("通知をオンにしました");
  }catch(e){
    console.error(e);
    toast("通知の設定に失敗しました");
  }
}

async function dayOp(ds, op, payload){
  if(!state.memberId){ toast("先に名前を登録してください"); return; }
  var body = Object.assign({op:op}, payload);
  var r = await api("/api/day/"+ds, {method:"POST", body: body});
  if(!r.ok){
    if(r.data && r.data.error) toast(r.data.error === "busy" ? "混み合っています。もう一度お試しください" : r.data.error);
    await refreshState();
    return;
  }
  state.days.set(ds, r.data.day);
  renderCalendar(); renderStats();
  if(state.openDate===ds) renderDayModal();
}

// ---------- swipe-down-to-close for bottom sheets (scroll chaining) ----------
// #daySheet / #adminSheet are the persistent scrollable containers (only
// their innerHTML is replaced on render, so binding once here is safe).
// A swipe anywhere inside scrolls the content normally; only once it's
// already scrolled to the top does continuing to drag down convert into
// closing the sheet — like a native iOS sheet.
function enableSwipeToClose(sheetEl, closeFn){
  var startY = 0, dragging = false, lastDelta = 0;
  sheetEl.addEventListener("touchstart", function(e){
    startY = e.touches[0].clientY;
    dragging = false;
    lastDelta = 0;
  }, {passive:true});
  sheetEl.addEventListener("touchmove", function(e){
    var y = e.touches[0].clientY;
    if(!dragging){
      if(sheetEl.scrollTop<=0 && y>startY){
        dragging = true;
        startY = y; // reset baseline so the drag starts smoothly at 0
        sheetEl.style.transition = "none";
      } else {
        return; // still room to scroll (or moving up) — let it scroll normally
      }
    }
    lastDelta = Math.max(0, y-startY);
    sheetEl.style.transform = "translateY("+lastDelta+"px)";
    e.preventDefault();
  }, {passive:false});
  sheetEl.addEventListener("touchend", function(){
    if(!dragging) return;
    dragging = false;
    var threshold = window.innerHeight/4;
    sheetEl.style.transition = "transform .18s ease";
    if(lastDelta>threshold){
      sheetEl.style.transform = "translateY(100%)";
      setTimeout(function(){
        sheetEl.style.transition=""; sheetEl.style.transform="";
        closeFn();
      }, 170);
    } else {
      sheetEl.style.transform = "translateY(0)";
      setTimeout(function(){ sheetEl.style.transition=""; }, 200);
    }
  });
}
enableSwipeToClose($("#daySheet"), closeDay);
enableSwipeToClose($("#adminSheet"), closeAdmin);

// ---------- swipe left/right to change month (live, finger-tracking) ----------
(function(){
  var viewport = $("#calViewport");
  var track = $("#calTrack");
  var startX=0, startY=0, dx=0, dragging=null, width=1;

  function atStart(){ return state.monthIdx===0; }
  function atEnd(){ return state.monthIdx===MONTHS.length-1; }

  viewport.addEventListener("touchstart", function(e){
    if(e.touches.length!==1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dx = 0;
    dragging = null;
    width = viewport.getBoundingClientRect().width || 1;
    track.style.transition = "none";
  }, {passive:true});

  viewport.addEventListener("touchmove", function(e){
    var x = e.touches[0].clientX, y = e.touches[0].clientY;
    var rawDx = x-startX, rawDy = y-startY;
    if(dragging===null){
      if(Math.abs(rawDx)<8 && Math.abs(rawDy)<8) return;
      dragging = Math.abs(rawDx) > Math.abs(rawDy);
      if(!dragging) return; // more vertical than horizontal — let the page scroll instead
    }
    if(!dragging) return;
    dx = rawDx;
    if(dx>0 && atStart()) dx = dx*0.35; // rubber-band at the first/last month
    if(dx<0 && atEnd()) dx = dx*0.35;
    var pct = (dx/width) * (100/3);
    track.style.transform = "translateX(calc(-33.3334% + "+pct+"%))";
    e.preventDefault();
  }, {passive:false});

  function finish(){
    if(dragging!==true){ dragging=null; return; }
    dragging = null;
    var threshold = width*0.22;
    track.style.transition = "transform .22s ease";
    if(dx <= -threshold && !atEnd()){
      track.style.transform = "translateX(-66.6668%)";
      setTimeout(function(){ state.monthIdx++; renderCalendar(); }, 220);
    } else if(dx >= threshold && !atStart()){
      track.style.transform = "translateX(0%)";
      setTimeout(function(){ state.monthIdx--; renderCalendar(); }, 220);
    } else {
      track.style.transform = "translateX(-33.3334%)";
    }
  }
  viewport.addEventListener("touchend", finish);
  viewport.addEventListener("touchcancel", finish);
})();

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>掃除当番カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f5f2ea;
  --surface:#ffffff;
  --surface-2:#edeadf;
  --border:#ddd7c6;
  --text:#262219;
  --text-dim:#766f5e;
  --accent:#1f7a6c;
  --accent-contrast:#ffffff;
  --accent-soft:#e1efe9;
  --good:#2f9e59;
  --good-soft:#e3f5e9;
  --warn:#c17f1a;
  --warn-soft:#faeed8;
  --bad:#c24a4a;
  --bad-soft:#fae3e1;
  --chip:#efece2;
  --shadow:0 8px 24px rgba(40,35,20,0.10);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a;
    --surface:#1e2224;
    --surface-2:#262b2c;
    --border:#343b3a;
    --text:#e9e6dd;
    --text-dim:#9a9f93;
    --accent:#52d2b8;
    --accent-contrast:#0a1716;
    --accent-soft:#1c3330;
    --good:#4fbd84;
    --good-soft:#1c342a;
    --warn:#e2ac4c;
    --warn-soft:#3a2f1a;
    --bad:#e4817a;
    --bad-soft:#3b2220;
    --chip:#2a2f2f;
    --shadow:0 8px 24px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"]{
  --bg:#15181a;
  --surface:#1e2224;
  --surface-2:#262b2c;
  --border:#343b3a;
  --text:#e9e6dd;
  --text-dim:#9a9f93;
  --accent:#52d2b8;
  --accent-contrast:#0a1716;
  --accent-soft:#1c3330;
  --good:#4fbd84;
  --good-soft:#1c342a;
  --warn:#e2ac4c;
  --warn-soft:#3a2f1a;
  --bad:#e4817a;
  --bad-soft:#3b2220;
  --chip:#2a2f2f;
  --shadow:0 8px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Zen Kaku Gothic New",system-ui,-apple-system,sans-serif;
  padding-inline:16px;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(90px + env(safe-area-inset-bottom,0px));
  min-height:100%;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
h1,h2,h3{text-wrap:balance;margin:0;}
button{font-family:inherit;}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--bg); padding-block:6px 4px; margin-inline:-16px; padding-inline:16px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:8px;}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--accent-contrast);
  font-weight:900;font-size:15px;flex:none;
}
.brand .title{font-weight:700;font-size:15px;letter-spacing:.01em;}
.userchip{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);
  border:1px solid var(--border); border-radius:999px; padding:5px 10px 5px 6px;
  font-size:12.5px; color:var(--text); cursor:pointer; flex:none;
}
.userchip .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;}
.userchip.offline .dot{background:var(--text-dim);}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.monthnav h2{font-size:17px;font-weight:700;}
.navbtn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:16px; cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.navbtn:disabled{opacity:.35;cursor:default;}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);}
.legend span{display:inline-flex;align-items:center;gap:5px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

.dow-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;font-size:11.5px;color:var(--text-dim);text-align:center;padding-inline:2px;}
.weeks{display:flex;flex-direction:column;gap:7px;}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.cell{
  position:relative; min-height:72px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); padding:6px 6px 6px 8px; cursor:pointer; text-align:left;
  display:flex; flex-direction:column; gap:3px;
}
.cell.empty{visibility:hidden;}
.cell .d{font-size:12px; font-weight:700;}
.cell .status-bar{position:absolute; left:0; top:0; bottom:0; width:4px;}
.cell .names{display:flex;flex-direction:column;gap:2px; margin-top:auto;}
.cell .nm{font-size:10.5px; line-height:1.25; background:var(--chip); border-radius:5px; padding:1px 4px; white-space:normal; word-break:break-word;}
.cell .nm.absent{text-decoration:line-through; opacity:.55;}
.cell .today-ring{position:absolute; inset:2px; border:2px solid var(--accent); border-radius:10px; pointer-events:none;}
.cell.holiday .d{color:var(--bad);}
.cell .tag{font-size:8.5px; color:var(--text-dim);}
.full{background:var(--good-soft);}
.half{background:var(--warn-soft);}
.none{background:var(--bad-soft);}

.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--border);
  padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:center; gap:6px;
}
.tabbar-inner{display:flex; gap:6px; width:100%; max-width:560px;}
.tabbtn{
  flex:1; border:none; background:transparent; color:var(--text-dim);
  padding:8px 4px; border-radius:12px; font-size:12px; font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
}
.tabbtn.active{color:var(--accent); background:var(--accent-soft);}
.tabbtn .ic{font-size:17px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
.section-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}

.stat-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
.stat-row:last-child{border-bottom:none;}
.stat-rank{width:20px; text-align:center; font-size:11px; color:var(--text-dim); flex:none;}
.stat-name{flex:1; font-size:13.5px; font-weight:600;}
.stat-bar-track{flex:1.4; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden;}
.stat-bar{height:100%; background:var(--accent); border-radius:4px;}
.stat-nums{display:flex; gap:10px; font-size:12px; flex:none;}
.stat-nums b{font-size:14px;}
.stat-nums .lbl{color:var(--text-dim); font-size:10px; display:block;}

.overlay{
  position:fixed; inset:0; background:rgba(20,18,12,0.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;
}
.overlay[hidden]{display:none;}
.sheet{
  width:100%; max-width:560px; background:var(--surface); border-radius:20px 20px 0 0;
  max-height:88vh; overflow-y:auto; padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:var(--shadow);
}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 10px;}
.sheet-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.sheet-head h3{font-size:17px; font-weight:700;}
.sheet-head .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
.closebtn{border:none; background:var(--surface-2); width:30px;height:30px;border-radius:9px; color:var(--text); font-size:15px; cursor:pointer; flex:none;}

.slot{border:1px solid var(--border); border-radius:13px; padding:11px; margin-bottom:9px; display:flex; flex-direction:column; gap:8px;}
.slot-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.slot-who{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px;}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; flex:none;}
.badge{font-size:10.5px; padding:2px 7px; border-radius:999px; font-weight:700;}
.badge.absent{background:var(--bad-soft); color:var(--bad);}
.badge.open{background:var(--surface-2); color:var(--text-dim);}
.btnrow{display:flex; gap:6px; flex-wrap:wrap;}
.btn{border:none; border-radius:9px; padding:7px 11px; font-size:12.5px; font-weight:600; cursor:pointer;}
.btn.primary{background:var(--accent); color:var(--accent-contrast);}
.btn.ghost{background:var(--surface-2); color:var(--text);}
.btn.danger{background:var(--bad-soft); color:var(--bad);}
.btn:disabled{opacity:.4; cursor:default;}
.reqline{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border-radius:9px; padding:6px 9px; font-size:12px;}

.task{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:flex-start;}
.task:last-child{border-bottom:none;}
.task input{width:19px;height:19px; margin-top:2px; accent-color:var(--accent); flex:none;}
.task .tx{font-size:13.5px; font-weight:600; line-height:1.4;}
.task .tx.done{text-decoration:line-through; color:var(--text-dim);}
.task .detail{font-size:11.5px; color:var(--text-dim); line-height:1.5; margin-top:3px;}
.task .meta{font-size:10px; color:var(--accent); margin-top:3px;}

.roster{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px;}
.rosterbtn{
  border:1px solid var(--border); background:var(--surface-2); border-radius:12px;
  padding:12px 8px; text-align:center; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--text);
}
.rosterbtn.taken{opacity:.4; cursor:not-allowed;}
.rosterbtn .tk{display:block; font-size:10px; font-weight:500; color:var(--text-dim); margin-top:3px;}

.banner{background:var(--warn-soft); color:var(--warn); border-radius:12px; padding:10px 12px; font-size:12.5px; line-height:1.5;}
.toast{
  position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:60;
  background:var(--text); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:12.5px;
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand"><div class="mark">掃</div><div class="title">掃除当番カレンダー</div></div>
    <button class="userchip offline" id="userChip"><span class="dot"></span><span id="userChipLabel">未ログイン</span></button>
  </div>

  <div id="bannerArea"></div>

  <div id="calendarView">
    <div class="monthnav">
      <button class="navbtn" id="prevMonth">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="navbtn" id="nextMonth">›</button>
    </div>
    <div class="legend">
      <span><i style="background:var(--good)"></i>2人そろい</span>
      <span><i style="background:var(--warn)"></i>1人</span>
      <span><i style="background:var(--bad)"></i>まだ誰もいない</span>
    </div>
    <div class="dow-row"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div></div>
    <div class="weeks" id="weeks"></div>
  </div>

  <div id="statsView" hidden>
    <div class="card">
      <div class="monthnav" style="margin-bottom:10px;">
        <button class="navbtn" id="statsPrev">‹</button>
        <h2 id="statsMonthLabel" style="font-size:15px;"></h2>
        <button class="navbtn" id="statsNext">›</button>
      </div>
      <div class="section-title">当月の担当回数</div>
      <div id="statsMonth"></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="section-title">通算の担当回数（2026/10〜）</div>
      <div id="statsTotal"></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <div class="tabbar-inner">
    <button class="tabbtn active" data-tab="calendar"><span class="ic">🗓️</span>カレンダー</button>
    <button class="tabbtn" data-tab="stats"><span class="ic">📊</span>統計</button>
  </div>
</div>

<div class="overlay" id="dayOverlay" hidden>
  <div class="sheet" id="daySheet"></div>
</div>

<div class="overlay" id="loginOverlay" hidden>
  <div class="sheet" id="loginSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var MEMBERS = [
  {id:"takai", name:"高井"},
  {id:"yamamoto", name:"山本"},
  {id:"takahashi", name:"高橋"},
  {id:"kakihara", name:"柿原"},
  {id:"sao", name:"竿"},
  {id:"seyama", name:"瀬山"},
  {id:"yuki", name:"優希"},
  {id:"masaya", name:"まさや"},
  {id:"koike", name:"小池"},
  {id:"tsunoda", name:"角田"}
];
function memberName(id){ var m=MEMBERS.find(function(x){return x.id===id;}); return m?m.name:id; }

var MONTHS = [
  {y:2026,m:9}, {y:2026,m:10}, {y:2026,m:11},
  {y:2027,m:0}, {y:2027,m:1}, {y:2027,m:2}
];
var RANGE_START = new Date(2026,9,1);

var HOLIDAYS = {
  "2026-10-12":"スポーツの日",
  "2026-11-03":"文化の日",
  "2026-11-23":"勤労感謝の日",
  "2027-01-01":"元日",
  "2027-01-11":"成人の日",
  "2027-02-11":"建国記念の日",
  "2027-02-23":"天皇誕生日",
  "2027-03-21":"春分の日",
  "2027-03-22":"振替休日"
};

var DAILY_TASKS = [
  {id:"enter", text:"入室する", detail:"学生証をタッチ→暗証番号「5460」を入力→解錠ボタンを押す"},
  {id:"pc", text:"パソコンの電源をONにする"},
  {id:"dishes", text:"食器を洗う"},
  {id:"triangle", text:"三角コーナーの袋を入れ替える"},
  {id:"mugicha", text:"麦茶を作る"},
  {id:"pot", text:"ポットの水を交換する", detail:"水を入れ替えてコンセントを挿す"},
  {id:"ice", text:"（夏季のみ）冷凍庫の氷を作る"},
  {id:"evaporator", text:"エバポレーターをセットする", detail:"コンセントを挿す→①をON（Poff表示ならSet Clear）→②を押しCの点滅を確認→温度がマイナスになったら③を押しPump点灯を確認"},
  {id:"gomi_matome", text:"一般ゴミ・実験ゴミをまとめる", detail:"実験ゴミには廃液ラベル(赤・入口左の引き出し2段目)を貼り、日付・研究室名・自分の名前・含有主物質名(メタノール/アセトン)を記入する"},
  {id:"gomi_dashi", text:"ゴミを捨てに行く", detail:"一般ゴミ、入口のペットボトル・缶・ビン、ドラフト内の空の一斗缶・空ビン、金属、ガラス、ダンボール"},
  {id:"haieki_tank", text:"廃液タンクの残量を確認する", detail:"限界ラインを超えそうならロートを外して蓋を閉め、廃液ラベルをタンクの口が斜めの側に貼る。新しいポリタンクにロートを付け替え、持ち手に細長いシールを貼る（含水=青:水/アセトン、有機=赤:メタノール/アセトン、難燃=黄:クロロホルム）"},
  {id:"solvent", text:"溶媒を補充する", detail:"デュワー瓶が空なら一斗缶から灯油ポンプで移し替える。一斗缶も残り少なければ試薬ファイル(緑)から発注する"},
  {id:"trap", text:"トラップ管を片付ける", detail:"中身は含水へ廃棄→メタノール/アセトンで洗浄→引き出しへ収納"},
  {id:"dryrack", text:"網棚1段目の乾燥済み器具を所定の場所へ片付ける"},
  {id:"liquid_n2", text:"液体窒素の残量を確認する（木曜以外）", detail:"不足時は申込用紙(入口左の引き出し1段目)に内線5766・ハンコ・日付・希望量「満タン」・残量を記入し折ってクリアファイルへ。台車で10号館横の供給所へ。回収後は1階でエレベーターに液体窒素のみ乗せ、人は同乗せず3階まで階段で向かう"},
  {id:"iaso_register", text:"薬品が届いていたらIASOに登録する"},
  {id:"iaso_check", text:"IASOの指定数量が0.2を超えていないか確認する", detail:"超えていたら使用済み試薬を削除する（たまにでOK）"},
  {id:"vacuum", text:"掃除機をかける"},
  {id:"seikyo", text:"ホワイトボードの購入希望を確認し生協で買い出しする", detail:"佐々木先生の個室入って右の引き出し1段目から生協カードを取り、レジで提示。買い出し後はレシートとカードを引き出しへ戻す"}
];

function pad(n){ return n<10?"0"+n:""+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseIso(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayIso(){ return iso(new Date()); }
function sameDay(a,b){ return iso(a)===iso(b); }

var sortedHolidayDates = Object.keys(HOLIDAYS).sort();
var HOLIDAY_EVE = {};
(function(){
  sortedHolidayDates.forEach(function(hIso){
    var hd = parseIso(hIso);
    var cur = new Date(hd);
    for(var i=0;i<10;i++){
      cur.setDate(cur.getDate()-1);
      if(cur<RANGE_START) return;
      var dow = cur.getDay();
      if(dow>=1 && dow<=5 && !HOLIDAYS[iso(cur)]){
        HOLIDAY_EVE[iso(cur)] = {label:HOLIDAYS[hIso], holidayIso:hIso};
        return;
      }
    }
  });
})();

function weekOfMonth(d){ return Math.ceil(d.getDate()/7); }

function buildTasks(dateStr){
  var d = parseIso(dateStr);
  var dow = d.getDay();
  var list = DAILY_TASKS.slice();
  if(dow===1 && d.getDate()<=7){
    list.push({id:"bousai", text:"防災安全チェック（第1月曜）", detail:"入口近くの赤いファイルに日付とチェックを記入する"});
  }
  if(dow===2){
    list.push({id:"haieki_yoyaku_tue", text:"廃液予約をする"});
    var w = weekOfMonth(d);
    if(w===2||w===4){
      list.push({id:"sodai", text:"粗大ゴミを出す（第2・4火曜）", detail:"不要な椅子などがあれば5号館と11号館の間のスペースへ運ぶ"});
    }
  }
  if(dow===3){ list.push({id:"haieki_kaishu_wed", text:"廃液回収日"}); }
  if(dow===4){ list.push({id:"haieki_yoyaku_thu", text:"廃液予約をする"}); }
  if(dow===5){
    list.push({id:"haieki_kaishu_fri", text:"廃液回収日"});
    list.push({id:"kyujitsu_weekly", text:"休日届けを提出する", detail:"施設使用申込書(入口左奥の引き出し1段目)の「2.休日登校」に○、日時に次の日曜 8:00〜21:00 と記入し、5号館入口の警備員さんへ提出する"});
  }
  var eve = HOLIDAY_EVE[dateStr];
  if(eve){
    list.push({id:"holiday_todoke_"+eve.holidayIso, text:(eve.holidayIso+"「"+eve.label+"」の休日届けを早めに提出する（まだなら）")});
  }
  return list;
}

function allWeekdaysOfMonth(y,m){
  var out=[];
  var d = new Date(y,m,1);
  while(d.getMonth()===m){
    var dow=d.getDay();
    if(dow>=1 && dow<=5) out.push(new Date(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

// ---------- state ----------
var TOKEN_KEY = "cleaningRosterToken";
var state = {
  token: localStorage.getItem(TOKEN_KEY) || "",
  memberId:null,
  days: new Map(),
  claimed: {},
  monthIdx: 0,
  statsMonthIdx: 0,
  tab:"calendar",
  openDate:null,
  online:false
};
(function(){
  var now = new Date();
  for(var i=0;i<MONTHS.length;i++){
    if(now.getFullYear()===MONTHS[i].y && now.getMonth()===MONTHS[i].m){ state.monthIdx=i; state.statsMonthIdx=i; return; }
  }
  if(now < RANGE_START){ state.monthIdx=0; state.statsMonthIdx=0; }
  else { state.monthIdx=MONTHS.length-1; state.statsMonthIdx=MONTHS.length-1; }
})();

function $(sel){ return document.querySelector(sel); }
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._h);
  toast._h=setTimeout(function(){ t.classList.remove("show"); },2200);
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

// ---------- API ----------
async function api(path, opts){
  opts = opts || {};
  var headers = {"content-type":"application/json"};
  if(state.token) headers["authorization"] = "Bearer "+state.token;
  var res;
  try{
    res = await fetch(path, {
      method: opts.method||"GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }catch(e){
    state.online = false; renderBanner();
    return {ok:false, status:0, data:{error:"network"}};
  }
  state.online = true; renderBanner();
  var data = {};
  try{ data = await res.json(); }catch(e){}
  return {ok: res.ok, status: res.status, data: data};
}

// ---------- rendering ----------
function renderBanner(){
  var el = $("#bannerArea");
  if(!state.online){
    el.innerHTML = '<div class="banner">サーバーに接続できません。電波状況を確認し、再度お試しください。</div>';
  } else {
    el.innerHTML = "";
  }
}

function renderUserChip(){
  var chip=$("#userChip"), label=$("#userChipLabel");
  if(state.memberId){
    chip.classList.remove("offline");
    label.textContent = memberName(state.memberId);
  } else {
    chip.classList.add("offline");
    label.textContent = "未ログイン";
  }
}

function monthLabel(mo){ return mo.y+"年"+(mo.m+1)+"月"; }

function renderCalendar(){
  var mo = MONTHS[state.monthIdx];
  $("#monthLabel").textContent = monthLabel(mo);
  $("#prevMonth").disabled = state.monthIdx===0;
  $("#nextMonth").disabled = state.monthIdx===MONTHS.length-1;

  var days = allWeekdaysOfMonth(mo.y, mo.m);
  var weeksEl = $("#weeks");
  weeksEl.innerHTML="";
  var leadBlanks = days[0].getDay()-1; // getDay() is 1(Mon)..5(Fri) here, column 0..4
  var week = [];
  for(var i=0;i<leadBlanks;i++) week.push(null);
  days.forEach(function(d){
    week.push(d);
    if(week.length===5){ weeksEl.appendChild(renderWeekRow(week)); week=[]; }
  });
  if(week.length){
    while(week.length<5) week.push(null);
    weeksEl.appendChild(renderWeekRow(week));
  }
}

function renderWeekRow(week){
  var row=document.createElement("div");
  row.className="week";
  week.forEach(function(d){
    if(!d){ var e=document.createElement("div"); e.className="cell empty"; row.appendChild(e); return; }
    row.appendChild(renderCell(d));
  });
  return row;
}

function slotCount(data){
  if(!data) return 0;
  var c=0;
  if(data.slot1 && data.slot1.memberId && data.slot1.status!=="absent") c++;
  if(data.slot2 && data.slot2.memberId && data.slot2.status!=="absent") c++;
  return c;
}

function renderCell(d){
  var ds = iso(d);
  var data = state.days.get(ds);
  var cnt = slotCount(data);
  var cell=document.createElement("button");
  cell.className="cell "+(cnt===2?"full":cnt===1?"half":"none")+(HOLIDAYS[ds]?" holiday":"");
  cell.setAttribute("type","button");
  var bar = cnt===2?"var(--good)":cnt===1?"var(--warn)":"var(--bad)";
  var html = '<div class="status-bar" style="background:'+bar+'"></div>';
  if(sameDay(d,new Date())) html += '<div class="today-ring"></div>';
  html += '<div class="d">'+d.getDate()+'</div>';
  if(HOLIDAYS[ds]) html += '<div class="tag">'+HOLIDAYS[ds]+'</div>';
  var names = [];
  [data&&data.slot1, data&&data.slot2].forEach(function(s){
    if(s && s.memberId) names.push('<div class="nm'+(s.status==="absent"?" absent":"")+'">'+escapeHtml(s.name||memberName(s.memberId))+'</div>');
  });
  html += '<div class="names">'+names.join("")+'</div>';
  cell.innerHTML = html;
  cell.addEventListener("click", function(){ openDay(ds); });
  return cell;
}

function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function renderStats(){
  renderStatsTable($("#statsMonth"), true);
  renderStatsTable($("#statsTotal"), false);
  $("#statsMonthLabel").textContent = monthLabel(MONTHS[state.statsMonthIdx]);
  $("#statsPrev").disabled = state.statsMonthIdx===0;
  $("#statsNext").disabled = state.statsMonthIdx===MONTHS.length-1;
}

function renderStatsTable(container, monthOnly){
  var mo = MONTHS[state.statsMonthIdx];
  var counts = {};
  MEMBERS.forEach(function(m){ counts[m.id]=0; });
  var today = todayIso();
  state.days.forEach(function(data, ds){
    if(ds>today) return;
    if(monthOnly){
      var d=parseIso(ds);
      if(d.getFullYear()!==mo.y || d.getMonth()!==mo.m) return;
    }
    [data.slot1, data.slot2].forEach(function(s){
      if(s && s.memberId && s.status!=="absent" && counts.hasOwnProperty(s.memberId)) counts[s.memberId]++;
    });
  });
  var rows = MEMBERS.map(function(m){ return {id:m.id, name:m.name, n:counts[m.id]}; });
  rows.sort(function(a,b){ return b.n-a.n || a.name.localeCompare(b.name,"ja"); });
  var max = Math.max(1, rows[0]?rows[0].n:1);
  container.innerHTML = rows.map(function(r,i){
    return '<div class="stat-row">'+
      '<div class="stat-rank">'+(i+1)+'</div>'+
      '<div class="stat-name">'+escapeHtml(r.name)+(r.id===state.memberId?' <span class="mono" style="color:var(--accent);font-size:10px;">(あなた)</span>':'')+'</div>'+
      '<div class="stat-bar-track"><div class="stat-bar" style="width:'+Math.round(r.n/max*100)+'%"></div></div>'+
      '<div class="stat-nums mono"><b>'+r.n+'</b></div>'+
    '</div>';
  }).join("");
}

// ---------- day modal ----------
function openDay(ds){
  state.openDate = ds;
  $("#dayOverlay").hidden=false;
  renderDayModal();
}
function closeDay(){
  state.openDate=null;
  $("#dayOverlay").hidden=true;
}

function renderDayModal(){
  if(!state.openDate) return;
  var ds = state.openDate;
  var d = parseIso(ds);
  var data = state.days.get(ds) || {};
  var dowLabel = ["日","月","火","水","木","金","土"][d.getDay()];
  var sheet = $("#daySheet");

  var head = '<div class="sheet-handle"></div><div class="sheet-head">'+
    '<div><h3>'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+dowLabel+'）</h3>'+
    '<div class="sub">'+(HOLIDAYS[ds]?('祝日：'+HOLIDAYS[ds]+'　'):'')+(ds===todayIso()?'本日':'')+'</div></div>'+
    '<button class="closebtn" id="dayClose">✕</button></div>';

  var slotsHtml = ["slot1","slot2"].map(function(key){ return renderSlot(ds, data, key); }).join("");

  var tasks = buildTasks(ds);
  var checklist = data.checklist || {};
  var tasksHtml = tasks.map(function(t){
    var done = checklist[t.id] && checklist[t.id].done;
    return '<label class="task">'+
      '<input type="checkbox" data-task="'+t.id+'" '+(done?"checked":"")+'>'+
      '<div><div class="tx '+(done?"done":"")+'">'+escapeHtml(t.text)+'</div>'+
      (t.detail?('<div class="detail">'+escapeHtml(t.detail)+'</div>'):'')+
      (done?('<div class="meta">✓ '+escapeHtml(checklist[t.id].by||'')+'</div>'):'')+
      '</div></label>';
  }).join("");

  sheet.innerHTML = head +
    '<div class="section-title" style="margin-top:4px;">担当（2名）</div>'+
    slotsHtml+
    '<div class="section-title" style="margin-top:14px; display:flex; align-items:center; justify-content:space-between;">'+
      '<span>やることリスト</span>'+
      '<span class="btnrow" style="gap:6px;">'+
        '<button class="btn ghost" id="checkAllBtn" type="button">すべてチェック</button>'+
        '<button class="btn ghost" id="uncheckAllBtn" type="button">すべて解除</button>'+
      '</span>'+
    '</div>'+
    '<div id="taskList">'+tasksHtml+'</div>';

  $("#dayClose").addEventListener("click", closeDay);
  sheet.querySelectorAll("[data-join]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"join",{slot:b.dataset.join}); }); });
  sheet.querySelectorAll("[data-leave]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"leave",{slot:b.dataset.leave}); }); });
  sheet.querySelectorAll("[data-absent]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"absent",{slot:b.dataset.absent}); }); });
  sheet.querySelectorAll("[data-request]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"request",{slot:b.dataset.request}); toast("交代リクエストを送りました"); }); });
  sheet.querySelectorAll("[data-approve]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"approve",{slot:b.dataset.approve, targetMemberId:b.dataset.mid}); }); });
  sheet.querySelectorAll("[data-decline]").forEach(function(b){ b.addEventListener("click", function(){ dayOp(ds,"decline",{slot:b.dataset.decline, targetMemberId:b.dataset.mid}); }); });
  sheet.querySelectorAll("[data-task]").forEach(function(b){ b.addEventListener("change", function(){
    if(!state.memberId){ toast("先に名前を登録してください"); renderDayModal(); return; }
    dayOp(ds,"task",{taskId:b.dataset.task, done:b.checked});
  }); });
  $("#checkAllBtn").addEventListener("click", function(){
    if(!state.memberId){ toast("先に名前を登録してください"); return; }
    dayOp(ds,"taskAll",{taskIds: tasks.map(function(t){return t.id;}), done:true});
  });
  $("#uncheckAllBtn").addEventListener("click", function(){
    dayOp(ds,"taskAll",{taskIds: tasks.map(function(t){return t.id;}), done:false});
  });
}

function renderSlot(ds, data, key){
  var s = data[key];
  var myId = state.memberId;
  if(!s || !s.memberId){
    return '<div class="slot"><div class="slot-top">'+
      '<div class="slot-who"><div class="avatar">?</div>枠が空いています</div>'+
      '<span class="badge open">未定</span></div>'+
      '<div class="btnrow"><button class="btn primary" data-join="'+key+'" '+(!myId?"disabled":"")+'>この枠に参加する</button></div></div>';
  }
  var nm = s.name || memberName(s.memberId);
  var initial = nm.slice(0,1);
  var isMe = s.memberId===myId;
  var absent = s.status==="absent";
  var reqs = data[key==="slot1"?"req1":"req2"] || [];
  var iAlreadyRequested = reqs.some(function(r){ return r.memberId===myId; });

  var top = '<div class="slot-top"><div class="slot-who"><div class="avatar">'+escapeHtml(initial)+'</div>'+escapeHtml(nm)+'</div>'+
    (absent? '<span class="badge absent">欠席</span>' : '')+
    '</div>';

  var btns = '<div class="btnrow">';
  if(absent){
    btns += '<button class="btn ghost" data-absent="'+key+'" '+(!myId?"disabled":"")+'>出席に戻す</button>';
    if(!isMe) btns += '<button class="btn primary" data-join="'+key+'" '+(!myId?"disabled":"")+'>代わりに参加する</button>';
  } else if(isMe){
    btns += '<button class="btn danger" data-leave="'+key+'">参加を取り消す</button>';
  } else {
    btns += '<button class="btn ghost" data-absent="'+key+'" '+(!myId?"disabled":"")+'>欠席にする</button>';
    btns += '<button class="btn ghost" data-request="'+key+'" '+(!myId||iAlreadyRequested?"disabled":"")+'>'+(iAlreadyRequested?"交代リクエスト送信済み":"交代をリクエスト")+'</button>';
  }
  btns += '</div>';

  var reqHtml = "";
  if(isMe && !absent && reqs.length){
    reqHtml = '<div style="display:flex;flex-direction:column;gap:6px;">'+reqs.map(function(r){
      return '<div class="reqline"><span>'+escapeHtml(r.name)+' さんから交代リクエスト</span>'+
        '<span class="btnrow"><button class="btn primary" data-approve="'+key+'" data-mid="'+r.memberId+'">承認</button>'+
        '<button class="btn ghost" data-decline="'+key+'" data-mid="'+r.memberId+'">却下</button></span></div>';
    }).join("")+'</div>';
  }

  return '<div class="slot">'+top+btns+reqHtml+'</div>';
}

// ---------- login ----------
function renderLogin(){
  var needsLogin = !state.memberId;
  $("#loginOverlay").hidden = !needsLogin;
  if(!needsLogin) return;
  var claimed = state.claimed || {};
  var html = '<div class="sheet-handle"></div>'+
    '<div class="sheet-head"><div><h3>名前を選んでください</h3><div class="sub">この端末に名前を1つ紐付けます</div></div></div>'+
    '<div class="roster">'+MEMBERS.map(function(m){
      var taken = !!claimed[m.id];
      return '<button class="rosterbtn '+(taken?"taken":"")+'" data-pick="'+m.id+'" '+(taken?"disabled":"")+'>'+escapeHtml(m.name)+(taken?'<span class="tk">選択済み</span>':'')+'</button>';
    }).join("")+'</div>';
  $("#loginSheet").innerHTML = html;
  $("#loginSheet").querySelectorAll("[data-pick]").forEach(function(b){
    b.addEventListener("click", function(){ pickMember(b.dataset.pick); });
  });
}

// ---------- data sync ----------
async function refreshState(){
  var r = await api("/api/state");
  if(!r.ok) return;
  var map = new Map();
  Object.keys(r.data.days||{}).forEach(function(ds){ map.set(ds, r.data.days[ds]); });
  state.days = map;
  var claimed = {};
  (r.data.claimed||[]).forEach(function(id){ claimed[id]=true; });
  state.claimed = claimed;
  renderCalendar(); renderStats();
  if(!state.memberId) renderLogin();
  if(state.openDate) renderDayModal();
}

async function init(){
  if(state.token){
    var r = await api("/api/me");
    if(r.ok && r.data.memberId){ state.memberId = r.data.memberId; }
  }
  renderUserChip();
  await refreshState();
  renderLogin();
  setInterval(refreshState, 15000);
}

async function pickMember(memberId){
  var r = await api("/api/claim", {method:"POST", body:{memberId: memberId}});
  if(!r.ok){
    if(r.data && r.data.error==="already_claimed") toast("その名前はすでに使われています");
    else toast("登録に失敗しました。もう一度お試しください");
    await refreshState();
    return;
  }
  state.token = r.data.token;
  localStorage.setItem(TOKEN_KEY, state.token);
  state.memberId = r.data.memberId;
  renderUserChip(); renderLogin();
  await refreshState();
  toast(memberName(memberId)+" として登録しました");
}

async function changeIdentity(){
  if(!state.memberId) return;
  if(!confirm("名前の登録を解除して選び直しますか？")) return;
  await api("/api/release", {method:"POST", body:{}});
  state.memberId = null;
  renderUserChip();
  await refreshState();
}

async function dayOp(ds, op, payload){
  if(!state.memberId){ toast("先に名前を登録してください"); return; }
  var body = Object.assign({op:op}, payload);
  var r = await api("/api/day/"+ds, {method:"POST", body: body});
  if(!r.ok){
    if(r.data && r.data.error) toast(r.data.error === "busy" ? "混み合っています。もう一度お試しください" : r.data.error);
    await refreshState();
    return;
  }
  state.days.set(ds, r.data.day);
  renderCalendar(); renderStats();
  if(state.openDate===ds) renderDayModal();
}

// ---------- wiring ----------
$("#prevMonth").addEventListener("click", function(){ if(state.monthIdx>0){ state.monthIdx--; renderCalendar(); } });
$("#nextMonth").addEventListener("click", function(){ if(state.monthIdx<MONTHS.length-1){ state.monthIdx++; renderCalendar(); } });
$("#statsPrev").addEventListener("click", function(){ if(state.statsMonthIdx>0){ state.statsMonthIdx--; renderStats(); } });
$("#statsNext").addEventListener("click", function(){ if(state.statsMonthIdx<MONTHS.length-1){ state.statsMonthIdx++; renderStats(); } });
$("#userChip").addEventListener("click", changeIdentity);
document.querySelectorAll(".tabbtn").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".tabbtn").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    state.tab = b.dataset.tab;
    $("#calendarView").hidden = state.tab!=="calendar";
    $("#statsView").hidden = state.tab!=="stats";
    if(state.tab==="stats") renderStats();
  });
});

renderCalendar();
renderStats();
renderUserChip();
init();

})();
</script>
